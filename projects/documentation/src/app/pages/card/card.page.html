<docs-layout
  title="Card"
  description="Cards contain content and actions about a single subject. They provide a flexible and extensible content container with multiple variants and slots."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: appearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: appearanceTs },
    ]"
    title="Appearance"
  >
    <app-card-appearance-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: spacingHtml },
      { label: 'TypeScript', lang: 'typescript', value: spacingTs },
    ]"
    title="Spacing"
  >
    <app-card-spacing-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: slotsHtml },
      { label: 'TypeScript', lang: 'typescript', value: slotsTs },
    ]"
    title="Content Slots"
  >
    <app-card-slots-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: closableHtml },
      { label: 'TypeScript', lang: 'typescript', value: closableTs },
    ]"
    title="Closable & Extra Header"
  >
    <app-card-closable-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: mediaHtml },
      { label: 'TypeScript', lang: 'typescript', value: mediaTs },
    ]"
    title="Edge-to-Edge Media"
  >
    <app-card-media-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: radiusHtml },
      { label: 'TypeScript', lang: 'typescript', value: radiusTs },
    ]"
    title="Border Radius"
  >
    <app-card-radius-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: customStyleHtml },
      { label: 'TypeScript', lang: 'typescript', value: customStyleTs },
    ]"
    title="Custom Styling & Layouts"
  >
    <app-card-custom-style-example />
  </doc-example-component>
</docs-layout>
