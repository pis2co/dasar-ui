<div style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap">
  <dasar-card appearance="elevated" label="Elevated Card" style="width: 300px">
    <p>This is the default card appearance with a subtle shadow to lift it off the page.</p>
  </dasar-card>

  <dasar-card appearance="outline" label="Outline Card" style="width: 300px">
    <p>This card uses a border instead of a shadow for a flatter, cleaner look.</p>
  </dasar-card>

  <dasar-card appearance="borderless" label="Borderless Card" style="width: 300px">
    <p>This card has no border or shadow, useful for grouping content in an existing container.</p>
  </dasar-card>
</div>
