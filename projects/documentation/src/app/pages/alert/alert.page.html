<docs-layout
  title="Alert"
  description="Shows a short, important message in one of five color variants, with an optional title, leading icon and close button. Bordered by default. Emits onClose when dismissed and onAfterLeave once the leave animation finishes, and supports [(visible)] to show it again."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-alert-basic-example />
  </doc-example-component>

    [codes]="[
      { label: 'HTML', lang: 'html', value: variantHtml },
      { label: 'TypeScript', lang: 'typescript', value: variantTs },
