<dasar-theme-provider [componentConfig]="componentConfig" [tokenConfig]="tokenConfig">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <dasar-alert title="Primary">Uses the themed radius, padding and colors.</dasar-alert>
    <dasar-alert variant="danger" title="Danger">
      Also closeable with an icon from components.alert.
    </dasar-alert>
  </div>
</dasar-theme-provider>

<p style="font-size: 12px; margin-top: 8px; color: gray">
  components.alert makes every alert closeable and adds an icon. tokens.light.alert changes the
  radius, padding and primary colors.
</p>
