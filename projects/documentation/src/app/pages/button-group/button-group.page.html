<docs-layout
  title="Button Group"
  description="Groups related buttons in a horizontal or vertical row, attached with shared borders or spaced apart, and sets a shared size, variant, appearance and disabled state for every button inside."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-button-group-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: orientationHtml },
      { label: 'TypeScript', lang: 'typescript', value: orientationTs },
    ]"
    title="Orientation"
  >
    <app-button-group-orientation-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizeHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizeTs },
    ]"
    title="Size"
  >
    <app-button-group-size-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: variantAppearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: variantAppearanceTs },
    ]"
    title="Variant & Appearance"
  >
    <app-button-group-variant-appearance-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: detachedHtml },
      { label: 'TypeScript', lang: 'typescript', value: detachedTs },
    ]"
    title="Detached"
  >
    <app-button-group-detached-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: iconsHtml },
      { label: 'TypeScript', lang: 'typescript', value: iconsTs },
    ]"
    title="With Icons"
  >
    <app-button-group-icons-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: toggleHtml },
      { label: 'TypeScript', lang: 'typescript', value: toggleTs },
    ]"
    title="Toggle Selection"
  >
    <app-button-group-toggle-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: fullWidthHtml },
      { label: 'TypeScript', lang: 'typescript', value: fullWidthTs },
    ]"
    title="Full Width"
  >
    <app-button-group-full-width-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: advancedThemeHtml },
      { label: 'TypeScript', lang: 'typescript', value: advancedThemeTs },
    ]"
    title="Advanced: Theme Defaults"
  >
    <app-button-group-advanced-theme-example />
  </doc-example-component>
</docs-layout>
