<dasar-theme-provider [componentConfig]="componentConfig" [tokenConfig]="tokenConfig">
  <dasar-button-group [attached]="false">
    <dasar-button>One</dasar-button>
    <dasar-button>Two</dasar-button>
    <dasar-button>Three</dasar-button>
  </dasar-button-group>
</dasar-theme-provider>

<p style="font-size: 12px; margin-top: 8px; color: gray">
  components.buttonGroup sets size and appearance. tokens.light.buttonGroup sets the pill radius and
  the detached gap.
</p>
