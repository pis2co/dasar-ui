<div style="width: 100%; max-width: 800px">
  <dasar-table [data]="orders" [columns]="columns" [expandable]="true">
    <ng-template expanded-slot let-row>
      <div
        style="
          padding: 24px;
          background: var(--theme-bg-hover-color);
          border-radius: 8px;
          margin: 8px;
        "
      >
        <div style="font-weight: 600; margin-bottom: 12px; font-size: 16px">
          Order Details: {{ row.id }}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; font-size: 14px">
          <div>
            <div style="color: var(--theme-text-secondary-color); margin-bottom: 4px">
              Shipping Address
            </div>
            <div>{{ row.address }}</div>
          </div>
          <div>
            <div style="color: var(--theme-text-secondary-color); margin-bottom: 4px">
              Tracking Number
            </div>
            <div style="font-family: monospace">{{ row.tracking }}</div>
          </div>
          <div>
            <div style="color: var(--theme-text-secondary-color); margin-bottom: 4px">Carrier</div>
            <div>{{ row.carrier }}</div>
          </div>
        </div>
      </div>
    </ng-template>
  </dasar-table>
</div>
