<div style="width: 100%; max-width: 800px">
  <dasar-table [data]="[]" [columns]="columns">
    <div
      empty-slot
      style="
        padding: 60px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      "
    >
      <div
        style="
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: var(--dasar-theme-primary-surface-color);
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--dasar-theme-primary-color);
        "
      >
        <dasar-icon name="search" size="lg"></dasar-icon>
      </div>
      <div style="text-align: center">
        <h4 style="margin: 0 0 8px 0; font-size: 18px">No results found</h4>
        <p
          style="
            margin: 0;
            color: var(--dasar-theme-text-secondary-color);
            font-size: 14px;
            max-width: 300px;
          "
        >
          Try adjusting your search or filter to find what you're looking for.
        </p>
      </div>
      <dasar-button appearance="outline">Clear Filters</dasar-button>
    </div>
  </dasar-table>
</div>
