<dasar-theme-provider [componentConfig]="componentConfig" [tokenConfig]="tokenConfig">
  <dasar-checkbox-group [value]="['b']">
    <dasar-checkbox label="Round success A" checked-value="a" />
    <dasar-checkbox label="Round success B" checked-value="b" />
  </dasar-checkbox-group>
</dasar-theme-provider>

<p style="font-size: 12px; margin-top: 8px; color: gray">
  components.checkbox sets size lg. tokens.light.checkbox changes the radius and checked color.
</p>
