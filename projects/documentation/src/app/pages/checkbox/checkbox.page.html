<docs-layout
  title="Checkbox"
  description="A checkbox for boolean or custom on/off values, with label, hint, error and disabled states. Works with ngModel and reactive forms. Dasar-checkbox-group combines several checkboxes into one array value, with optional value-field matching for objects."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-checkbox-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizeHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizeTs },

      { label: 'HTML', lang: 'html', value: customValuesHtml },
      { label: 'TypeScript', lang: 'typescript', value: customValuesTs },

  </doc-example-component>

    [codes]="[
      { label: 'HTML', lang: 'html', value: labelHintHtml },
