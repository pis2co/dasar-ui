<docs-layout
  title="Datepicker"
  description="A fully featured date selection component utilizing Dasar Calendar internally, supporting smart placement, localization, and rich custom templating."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic Usage"
  >
    <app-datepicker-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: appearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: appearanceTs },
    ]"
    title="Appearance & Sizes"
  >
    <app-datepicker-appearance-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: formatHtml },
      { label: 'TypeScript', lang: 'typescript', value: formatTs },
    ]"
    title="Formatting & Locales"
  >
    <app-datepicker-format-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: statesHtml },
      { label: 'TypeScript', lang: 'typescript', value: statesTs },
    ]"
    title="Validation & States"
  >
    <app-datepicker-states-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: placementHtml },
      { label: 'TypeScript', lang: 'typescript', value: placementTs },
    ]"
    title="Smart Placements"
  >
    <app-datepicker-placement-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: slotsHtml },
      { label: 'TypeScript', lang: 'typescript', value: slotsTs },
    ]"
    title="Custom Content Slots"
  >
    <app-datepicker-slots-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: footerHtml },
      { label: 'TypeScript', lang: 'typescript', value: footerTs },
    ]"
    title="Dropdown Footer Actions"
  >
    <app-datepicker-footer-example />
  </doc-example-component>
</docs-layout>
