<div style="display: flex; flex-direction: column; gap: 32px; width: 100%">
  <div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap">
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker
        label="Outline (Default)"
        appearance="outline"
        full-width
      ></dasar-datepicker>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker label="Filled Appearance" appearance="filled" full-width></dasar-datepicker>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker label="Subtle Appearance" appearance="subtle" full-width></dasar-datepicker>
    </div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap">
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker label="Small Size" size="sm" full-width></dasar-datepicker>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker label="Medium Size" size="md" full-width></dasar-datepicker>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-datepicker label="Large Size" size="lg" full-width></dasar-datepicker>
    </div>
  </div>
</div>
