<div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; width: 100%">
  <div style="flex: 1; min-width: 250px">
    <dasar-select
      label="Error State"
      [error]="true"
      hint="Please select a valid option."
      [options]="options"
      full-width
    ></dasar-select>
  </div>

  <div style="flex: 1; min-width: 250px">
    <dasar-select
      label="Disabled State"
      [disabled]="true"
      hint="Field locked."
      [options]="options"
      full-width
    ></dasar-select>
  </div>

  <div style="flex: 1; min-width: 250px">
    <dasar-select
      label="Loading State"
      [loading]="true"
      hint="Fetching data..."
      [options]="[]"
      full-width
    ></dasar-select>
  </div>
</div>
