<dasar-button [dasarModalTrigger]="modalTpl">Open a styled modal</dasar-button>

<ng-template #modalTpl let-close="close">
  <dasar-modal
    label="Custom styles"
    [header-style]="{ background: 'var(--dasar-theme-primary-color)', color: '#fff' }"
    [action-style]="{ 'justify-content': 'space-between' }"
    body-fluid
  >
    <img
      src="https://picsum.photos/800/300"
      alt="Placeholder"
      style="display: block; width: 100%"
    />
    <div style="padding: 16px">
      <p>
        <code>body-fluid</code> removes the body padding so the image reaches the modal edges. The
        <code>header-style</code> paints the header, and <code>action-style</code> pushes the footer
        buttons apart.
      </p>
      <p>
        Every section also accepts a <code>-style</code> and a <code>-class</code> input: container,
        header, close, body and actions.
      </p>
    </div>

    <div action-slot>
      <dasar-button
        appearance="outline"
        variant="secondary"
        size="md"
        radius="md"
        (click)="close()"
      >
        Cancel
      </dasar-button>
      <dasar-button size="md" radius="md" (click)="close()">Save</dasar-button>
    </div>
  </dasar-modal>
</ng-template>
