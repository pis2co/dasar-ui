<dasar-button [dasarModalTrigger]="modalTpl">Open a tall modal</dasar-button>

<ng-template #modalTpl let-close="close">
  <dasar-modal label="Scrollable body">
    @for (p of paragraphs; track p) {
      <p>
        Paragraph {{ p }}. When the content is taller than the viewport, only the body scrolls while
        the header and the actions stay visible.
      </p>
    }

    <div action-slot>
      <dasar-button size="md" radius="md" (click)="close()">Close</dasar-button>
    </div>
  </dasar-modal>
</ng-template>
