<div style="display: flex; gap: 8px; flex-wrap: wrap">
  @for (s of sizes; track s) {
    <dasar-button [dasarModalTrigger]="modalTpl" (click)="setSize(s)"> Size: {{ s }} </dasar-button>
  }
</div>

<ng-template #modalTpl let-close="close">
  <dasar-modal [size]="size()" [label]="'Size: ' + size()">
    <p>
      The <code>size</code> input controls both the width preset and the typographic scale inside
      the modal: <code>sm</code> is 400px, <code>md</code> is 560px and <code>lg</code> is 800px.
    </p>
    <div action-slot>
      <dasar-button size="md" radius="md" (click)="close()">Close</dasar-button>
    </div>
  </dasar-modal>
</ng-template>
