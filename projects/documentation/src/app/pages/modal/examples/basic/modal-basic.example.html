<dasar-button [dasarModalTrigger]="modalTpl">Open modal</dasar-button>

<ng-template #modalTpl let-close="close">
  <dasar-modal label="Basic modal">
    <p>
      Modal body content. Press <strong>Esc</strong>, click the backdrop, or use the ✕ button to
      close this dialog.
    </p>
    <div action-slot>
      <dasar-button size="md" radius="md" (click)="close()">Close</dasar-button>
    </div>
  </dasar-modal>
</ng-template>
