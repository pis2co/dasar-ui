<docs-layout
  builtOnPrimitive
  title="Modal"
  description="A modal dialog that overlays the page to focus the user on a task. Rendered into document.body via a portal using the trigger+template directive pattern."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-modal-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizeHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizeTs },
    ]"
    title="Size"
  >
    <app-modal-size-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: appearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: appearanceTs },
    ]"
    title="Appearance"
  >
    <app-modal-appearance-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: radiusSpacingHtml },
      { label: 'TypeScript', lang: 'typescript', value: radiusSpacingTs },
    ]"
    title="Radius & Spacing"
  >
    <app-modal-radius-spacing-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: widthHtml },
      { label: 'TypeScript', lang: 'typescript', value: widthTs },
    ]"
    title="Width"
  >
    <app-modal-width-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: slotsHtml },
      { label: 'TypeScript', lang: 'typescript', value: slotsTs },
    ]"
    title="Slots"
  >
    <app-modal-slots-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: scrollHtml },
      { label: 'TypeScript', lang: 'typescript', value: scrollTs },
    ]"
    title="Scrollable Body"
  >
    <app-modal-scroll-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: closeBehaviorHtml },
      { label: 'TypeScript', lang: 'typescript', value: closeBehaviorTs },
    ]"
    title="Close Behavior"
  >
    <app-modal-close-behavior-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: overlayHtml },
      { label: 'TypeScript', lang: 'typescript', value: overlayTs },
    ]"
    title="Overlay"
  >
    <app-modal-overlay-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: customStyleHtml },
      { label: 'TypeScript', lang: 'typescript', value: customStyleTs },
    ]"
    title="Custom Style"
  >
    <app-modal-custom-style-example />
  </doc-example-component>
</docs-layout>
