<dasar-tabs
  [items]="items"
  container-class="demo-tabs-container"
  list-class="demo-tabs-list"
  content-class="demo-tabs-content"
  [container-style]="{
    border: '1px dashed var(--theme-border-strong-color)',
    padding: '4px',
    'border-radius': 'var(--radius-lg)',
  }"
  [list-style]="{ 'justify-content': 'center' }"
  [content-style]="{ 'font-style': 'italic', 'text-align': 'center' }"
>
  <p>The container is dashed, the list is centered and the body is italic.</p>
</dasar-tabs>

<dasar-tabs [items]="items" [container-style]="{ '--tabs-gap-normal': '20px' }">
  <p>The tab gap is widened to 20px through the --tabs-gap-normal variable.</p>
</dasar-tabs>
