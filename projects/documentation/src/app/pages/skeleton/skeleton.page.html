<docs-layout
  title="Skeleton"
  description="A loading placeholder for text and boxes with sizes, repeat lines, circular avatars and an optional shimmer animation."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-skeleton-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: typesHtml },
      { label: 'TypeScript', lang: 'typescript', value: typesTs },
    ]"
    title="Types"
  >
    <app-skeleton-types-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizesHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizesTs },
    ]"
    title="Sizes"
  >
    <app-skeleton-sizes-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: repeatHtml },
      { label: 'TypeScript', lang: 'typescript', value: repeatTs },
    ]"
    title="Repeat"
  >
    <app-skeleton-repeat-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: circleHtml },
      { label: 'TypeScript', lang: 'typescript', value: circleTs },
    ]"
    title="Circle"
  >
    <app-skeleton-circle-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: radiusHtml },
      { label: 'TypeScript', lang: 'typescript', value: radiusTs },
    ]"
    title="Radius"
  >
    <app-skeleton-radius-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: animatedHtml },
      { label: 'TypeScript', lang: 'typescript', value: animatedTs },
    ]"
    title="Animated"
  >
    <app-skeleton-animated-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: fullWidthHtml },
      { label: 'TypeScript', lang: 'typescript', value: fullWidthTs },
    ]"
    title="Full Width"
  >
    <app-skeleton-full-width-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: cardPatternHtml },
      { label: 'TypeScript', lang: 'typescript', value: cardPatternTs },
    ]"
    title="Card Pattern"
  >
    <app-skeleton-card-pattern-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: themeHtml },
      { label: 'TypeScript', lang: 'typescript', value: themeTs },
    ]"
    title="Theme Config"
  >
    <app-skeleton-theme-example />
  </doc-example-component>
</docs-layout>
