<docs-layout
  title="Divider"
  description="Separates content with a horizontal or vertical line. Supports solid or dashed lines, an optional label placed left, center or right, and spacing presets."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-divider-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: dashedHtml },
      { label: 'TypeScript', lang: 'typescript', value: dashedTs },
    ]"
    title="Dashed"
  >
    <app-divider-dashed-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: labelHtml },
      { label: 'TypeScript', lang: 'typescript', value: labelTs },
    ]"
    title="With Label"
  >
    <app-divider-label-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: labelPlacementHtml },
      { label: 'TypeScript', lang: 'typescript', value: labelPlacementTs },
    ]"
    title="Label Placement"
  >
    <app-divider-label-placement-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: verticalHtml },
      { label: 'TypeScript', lang: 'typescript', value: verticalTs },
    ]"
    title="Vertical"
  >
    <app-divider-vertical-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: spacingHtml },
      { label: 'TypeScript', lang: 'typescript', value: spacingTs },
    ]"
    title="Spacing"
  >
    <app-divider-spacing-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: labelSlotHtml },
      { label: 'TypeScript', lang: 'typescript', value: labelSlotTs },
    ]"
    title="Label Slot"
  >
    <app-divider-label-slot-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: customStyleHtml },
      { label: 'TypeScript', lang: 'typescript', value: customStyleTs },
    ]"
    title="Custom Style"
  >
    <app-divider-custom-style-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: advancedThemeHtml },
      { label: 'TypeScript', lang: 'typescript', value: advancedThemeTs },
    ]"
    title="Advanced: Theme Defaults"
  >
    <app-divider-advanced-theme-example />
  </doc-example-component>
</docs-layout>
