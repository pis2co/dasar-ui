<div style="display: flex; flex-direction: column; gap: 16px; align-items: flex-start">
  <dasar-switch
    [(value)]="outline"
    [appearance]="'outline'"
    label="Outline (Default)"
    hint="Default outline appearance"
  />

  <dasar-switch
    [(value)]="filled"
    [appearance]="'filled'"
    label="Filled Appearance"
    hint="Filled appearance with solid background"
  />

  <dasar-switch
    [(value)]="elevated"
    [appearance]="'elevated'"
    label="Elevated Appearance"
    hint="Elevated appearance with shadow"
  />
</div>
