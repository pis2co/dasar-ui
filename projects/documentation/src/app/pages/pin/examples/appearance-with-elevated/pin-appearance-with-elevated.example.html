<div style="display: flex; flex-direction: column; gap: 24px; max-width: 480px; width: 100%">
  <div>
    <p
      style="
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--dasar-theme-text-secondary-color);
      "
    >
      Outline (Default)
    </p>
    <dasar-pin [length]="4" [appearance]="'outline'"></dasar-pin>
  </div>

  <div>
    <p
      style="
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--dasar-theme-text-secondary-color);
      "
    >
      Filled Appearance
    </p>
    <dasar-pin [length]="4" [appearance]="'filled'"></dasar-pin>
  </div>

  <div>
    <p
      style="
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--dasar-theme-text-secondary-color);
      "
    >
      Elevated Appearance
    </p>
    <dasar-pin [length]="4" [appearance]="'elevated'"></dasar-pin>
  </div>
</div>
