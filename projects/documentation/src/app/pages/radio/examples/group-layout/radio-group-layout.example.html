<p style="font-size: 12px; margin: 8px 0 4px; color: gray">horizontal</p>
<dasar-radio-group direction="horizontal" [(value)]="horizontal">
  <dasar-radio label="A" checked-value="a" />
  <dasar-radio label="B" checked-value="b" />
  <dasar-radio label="C" checked-value="c" />
</dasar-radio-group>

<p style="font-size: 12px; margin: 8px 0 4px; color: gray">disabled group</p>
<dasar-radio-group disabled [value]="'a'">
  <dasar-radio label="A" checked-value="a" />
  <dasar-radio label="B" checked-value="b" />
</dasar-radio-group>
