<docs-layout
  title="Radio"
  description="A radio button for picking one option out of several. Standalone radios sharing a name and ngModel behave as one group, including native arrow-key navigation. Dasar-radio-group manages the selection for you, with optional value-field matching for objects."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-radio-basic-example />
  </doc-example-component>

      { label: 'HTML', lang: 'html', value: sizeHtml },
