<div style="display: flex; flex-direction: column; gap: 32px; width: 100%">
  <div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap">
    <div style="flex: 1; min-width: 200px">
      <dasar-input label="Outline (Default)" appearance="outline" full-width></dasar-input>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-input label="Filled Appearance" appearance="filled" full-width></dasar-input>
    </div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap">
    <div style="flex: 1; min-width: 200px">
      <dasar-input label="Small Size" size="sm" placeholder="Small input" full-width></dasar-input>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-input
        label="Medium Size"
        size="md"
        placeholder="Medium input"
        full-width
      ></dasar-input>
    </div>
    <div style="flex: 1; min-width: 200px">
      <dasar-input label="Large Size" size="lg" placeholder="Large input" full-width></dasar-input>
    </div>
  </div>
</div>
