<div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; width: 100%">
  <div style="flex: 1; min-width: 200px">
    <dasar-input
      label="Readonly Field"
      [readonly]="true"
      value="Cannot edit this text"
      full-width
    ></dasar-input>
  </div>

  <div style="flex: 1; min-width: 200px">
    <dasar-input
      label="Error State"
      [error]="true"
      hint="Invalid username format."
      value="admin_@"
      full-width
    ></dasar-input>
  </div>

  <div style="flex: 1; min-width: 200px">
    <dasar-input
      label="Disabled State"
      [disabled]="true"
      hint="This field is currently disabled."
      full-width
      value="disabled"
    ></dasar-input>
  </div>
</div>
