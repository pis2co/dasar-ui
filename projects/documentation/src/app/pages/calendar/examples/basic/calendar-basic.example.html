<div style="display: flex; flex-direction: column; gap: 16px; width: 100%">
  <p style="margin: 0">
    Selected Date: <strong>{{ selectedDate() | date: 'fullDate' }}</strong>
  </p>

  <dasar-calendar
    (valueChange)="selectedDate.set($event)"
    [value]="selectedDate()"
    appearance="outline"
    full-width
  ></dasar-calendar>

  <dasar-calendar
    (valueChange)="selectedDate.set($event)"
    [value]="selectedDate()"
    appearance="elevated"
    full-width
  ></dasar-calendar>

  <dasar-calendar
    (valueChange)="selectedDate.set($event)"
    [value]="selectedDate()"
    appearance="borderless"
    full-width
  ></dasar-calendar>
</div>
