<div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap">
  <div style="width: 320px">
    <p style="margin: 0 0 12px 0; font-weight: 500">Hidden Header & Custom Styling</p>

    <dasar-calendar
      variant="dropdown"
      appearance="borderless"
      radius="none"
      [hide-header]="true"
      [value]="selectedDate()"
      (valueChange)="selectedDate.set($event)"
      [container-style]="{ backgroundColor: 'var(--dasar-theme-bg-hover-color)' }"
    ></dasar-calendar>
  </div>
</div>
