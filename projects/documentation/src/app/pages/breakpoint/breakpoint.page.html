<docs-layout
  title="Breakpoint"
  description="Reactive viewport info for showing different views per device. DasarBreakpointService exposes width, height, name and smAndDown style signals. Dasar-breakpoint shows or hides its content with hidden-at and show-at."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: serviceBasicsHtml },
      { label: 'TypeScript', lang: 'typescript', value: serviceBasicsTs },
    ]"
    title="Service Basics"
  >
    <app-breakpoint-service-basics-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: hiddenAtHtml },
      { label: 'TypeScript', lang: 'typescript', value: hiddenAtTs },

      { label: 'HTML', lang: 'html', value: showAtHtml },
      { label: 'TypeScript', lang: 'typescript', value: showAtTs },
    ]"

  >
    <app-breakpoint-show-at-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: pairHtml },
      { label: 'TypeScript', lang: 'typescript', value: pairTs },
    ]"

  <doc-example-component

      { label: 'HTML', lang: 'html', value: eventsHtml },

      { label: 'HTML', lang: 'html', value: customHtml },
