<docs-layout
  title="Tree"
  description="A hierarchical list with expand and collapse, selection, checkboxes with partial state, search, connecting lines, drag and drop reordering and slots for every part of a row."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-tree-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: fileHtml },
      { label: 'TypeScript', lang: 'typescript', value: fileTs },
    ]"
    title="File type"
  >
    <app-tree-file-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: selectableHtml },
      { label: 'TypeScript', lang: 'typescript', value: selectableTs },
    ]"
    title="Selectable"
  >
    <app-tree-selectable-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: multipleHtml },
      { label: 'TypeScript', lang: 'typescript', value: multipleTs },
    ]"
    title="Multiple"
  >
    <app-tree-multiple-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: showLineHtml },
      { label: 'TypeScript', lang: 'typescript', value: showLineTs },
    ]"
    title="Show line"
  >
    <app-tree-show-line-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: searchHtml },
      { label: 'TypeScript', lang: 'typescript', value: searchTs },
    ]"
    title="Search"
  >
    <app-tree-search-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: draggableHtml },
      { label: 'TypeScript', lang: 'typescript', value: draggableTs },
    ]"
    title="Draggable"
  >
    <app-tree-draggable-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: customIconsHtml },
      { label: 'TypeScript', lang: 'typescript', value: customIconsTs },
    ]"
    title="Custom icons"
  >
    <app-tree-custom-icons-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: slotsHtml },
      { label: 'TypeScript', lang: 'typescript', value: slotsTs },
    ]"
    title="Slots"
  >
    <app-tree-slots-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: ngModelHtml },
      { label: 'TypeScript', lang: 'typescript', value: ngModelTs },
    ]"
    title="ngModel"
  >
    <app-tree-ng-model-example />
  </doc-example-component>
</docs-layout>
