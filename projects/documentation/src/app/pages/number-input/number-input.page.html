<docs-layout
  title="Number Input"
  description="A numeric input field with built-in increment and decrement stepper controls."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic Usage"
  >
    <app-number-input-basic-example></app-number-input-basic-example>
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: appearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: appearanceTs },
    ]"
    title="Appearance & Sizes"
  >
    <app-number-input-appearance-example></app-number-input-appearance-example>
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: limitsHtml },
      { label: 'TypeScript', lang: 'typescript', value: limitsTs },
    ]"
    title="Min, Max & Step Limits"
  >
    <app-number-input-limits-example></app-number-input-limits-example>
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: statesHtml },
      { label: 'TypeScript', lang: 'typescript', value: statesTs },
    ]"
    title="Validation & States"
  >
    <app-number-input-states-example></app-number-input-states-example>
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: slotsHtml },
      { label: 'TypeScript', lang: 'typescript', value: slotsTs },
    ]"
    title="Prefix & Action Slots"
  >
    <app-number-input-slots-example></app-number-input-slots-example>
  </doc-example-component>
</docs-layout>
