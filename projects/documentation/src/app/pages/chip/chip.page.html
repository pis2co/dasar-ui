<docs-layout
  title="Chip"
  description="A compact label for tags, statuses and filters, with color variants, appearances, sizes and radius, plus removable, clickable and disabled states."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: variantHtml },
      { label: 'TypeScript', lang: 'typescript', value: variantTs },
    ]"
    title="Variant"
  >
    <app-chip-variant-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: appearanceHtml },
      { label: 'TypeScript', lang: 'typescript', value: appearanceTs },
    ]"
    title="Appearance"
  >
    <app-chip-appearance-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: radiusHtml },
      { label: 'TypeScript', lang: 'typescript', value: radiusTs },
    ]"
    title="Radius"
  >
    <app-chip-radius-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizesHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizesTs },
    ]"
    title="Sizes"
  >
    <app-chip-sizes-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: moreHtml },
      { label: 'TypeScript', lang: 'typescript', value: moreTs },
    ]"
    title="More example"
  >
    <app-chip-more-example />
  </doc-example-component>
</docs-layout>
