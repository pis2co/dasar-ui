<docs-layout
  title="Pagination"
  description="Page navigation with a sliding window of pages, an items-per-page picker, an ellipsis dropdown of hidden pages and a page summary."
  [apiData]="apiProps"

    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
