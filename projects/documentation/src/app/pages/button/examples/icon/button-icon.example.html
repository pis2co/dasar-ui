<div [style]="{ display: 'flex', gap: '12px', 'align-items': 'center', 'flex-wrap': 'wrap' }">
  <dasar-button variant="primary">
    <dasar-icon name="home" [stroke]="2"></dasar-icon>
    <span>Home</span>
  </dasar-button>
  <dasar-button variant="secondary" appearance="outline">
    <span>Settings</span>
    <dasar-icon name="settings" [stroke]="2"></dasar-icon>
  </dasar-button>
  <dasar-button variant="ghost" icon-only aria-label="User Profile">
    <dasar-icon name="user" [stroke]="2" size="sm"></dasar-icon>
  </dasar-button>
  <dasar-button variant="primary" icon-only aria-label="Home">
    <dasar-icon name="chevron-left" [stroke]="2"></dasar-icon>
  </dasar-button>
  <dasar-button variant="primary" appearance="outline" icon-only aria-label="Home">
    <dasar-icon name="chevron-right" [stroke]="2"></dasar-icon>
  </dasar-button>
</div>
