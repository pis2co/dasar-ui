<docs-layout
  title="Icon"
  description="An SVG icon rendered by name from the built-in registry, with adjustable size, color and stroke width."
  [apiData]="apiProps"
>
  <doc-example-component
    [previewStyle]="{ display: 'flex', gap: '12px', 'align-items': 'center', 'flex-wrap': 'wrap' }"
    [codes]="[{ label: 'HTML', lang: 'html', value: basicExampleCode }]"
    title="Basic"
  >
    <dasar-icon name="home"></dasar-icon>
    <dasar-icon name="home" color="red"></dasar-icon>
    <dasar-icon name="home" [stroke]="1"></dasar-icon>
  </doc-example-component>
</docs-layout>
