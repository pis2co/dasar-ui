<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
  <dasar-menu label="Bottom Start" placement="bottom-start" [items]="menuItems" />
  <dasar-menu label="Bottom End" placement="bottom-end" [items]="menuItems" />
  <dasar-menu label="Top Start" placement="top-start" [items]="menuItems" />
  <dasar-menu label="Top End" placement="top-end" [items]="menuItems" />
</div>

<p style="margin: 12px 0 0; font-size: 14px; color: var(--dasar-theme-text-secondary-color)">
  <code>placement</code> is the <em>preferred</em> side of the trigger. When the preferred side has
  no room left in the viewport, the panel automatically flips to the side with more space, both
  vertically and horizontally, and it re-checks while you scroll or resize.
</p>
