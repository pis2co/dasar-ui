<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
  <dasar-button [dasarMenuTrigger]="bottomStartTpl" [dasarMenuTriggerPlacement]="'bottom-start'">
    Bottom Start (Default)
  </dasar-button>
  <ng-template #bottomStartTpl>
    <dasar-menu [items]="menuItems" />
  </ng-template>

  <dasar-button [dasarMenuTrigger]="bottomEndTpl" [dasarMenuTriggerPlacement]="'bottom-end'">
    Bottom End
  </dasar-button>
  <ng-template #bottomEndTpl>
    <dasar-menu [items]="menuItems" />
  </ng-template>

  <dasar-button [dasarMenuTrigger]="topStartTpl" [dasarMenuTriggerPlacement]="'top-start'">
    Top Start
  </dasar-button>
  <ng-template #topStartTpl>
    <dasar-menu [items]="menuItems" />
  </ng-template>

  <dasar-button [dasarMenuTrigger]="topEndTpl" [dasarMenuTriggerPlacement]="'top-end'">
    Top End
  </dasar-button>
  <ng-template #topEndTpl>
    <dasar-menu [items]="menuItems" />
  </ng-template>
</div>
