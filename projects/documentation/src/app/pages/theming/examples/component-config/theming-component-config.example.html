<dasar-theme-provider [componentConfig]="componentConfig">
  <dasar-card label="From component config">
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
      <dasar-button variant="primary">Outline sm</dasar-button>
      <dasar-button variant="secondary">Outline sm</dasar-button>
    </div>
  </dasar-card>
</dasar-theme-provider>

<p style="font-size: 12px; margin-top: 8px; color: gray">
  components.button sets appearance and size. components.card sets the elevated look and compact
  spacing. Explicit inputs on a component always win over these defaults.
</p>
