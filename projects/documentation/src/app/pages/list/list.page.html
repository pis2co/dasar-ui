<docs-layout
  title="List"
  description="A vertical list of items with an optional header, footer, prefix and suffix, plus dividers, borders and hover or click states."
  [apiData]="apiProps"
>
  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: basicHtml },
      { label: 'TypeScript', lang: 'typescript', value: basicTs },
    ]"
    title="Basic"
  >
    <app-list-basic-example />
  </doc-example-component>

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: sizeHtml },
      { label: 'TypeScript', lang: 'typescript', value: sizeTs },

      { label: 'HTML', lang: 'html', value: borderedDividerHtml },
      { label: 'TypeScript', lang: 'typescript', value: borderedDividerTs },

  >

  <doc-example-component
    [codes]="[
      { label: 'HTML', lang: 'html', value: interactiveHtml },
      { label: 'TypeScript', lang: 'typescript', value: interactiveTs },

      { label: 'HTML', lang: 'html', value: prefixSuffixHtml },

  <doc-example-component
