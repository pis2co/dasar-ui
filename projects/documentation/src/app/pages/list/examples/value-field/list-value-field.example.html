<dasar-list
  selectable
  bordered
  value-field="id"
  [value]="selected()"
  (valueChange)="selected.set($event)"
>
  @for (member of members; track member.id) {
    <dasar-list-item [value]="member">{{ member.name }}</dasar-list-item>
  }
</dasar-list>

<p style="font-size: 12px; margin-top: 8px; color: gray">
  Selected id: {{ selected().id }}. Items match by id, so extra fields are ignored.
</p>
