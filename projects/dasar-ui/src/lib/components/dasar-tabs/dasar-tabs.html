<div
  class="dasar-tabs-container appearance-{{ appearance }} size-{{ size }} spacing-{{
    spacing
  }} radius-{{ radius }}"
  [class.fluid]="fluid"
  [ngClass]="containerClass"
  [ngStyle]="containerStyle"
>
  <div class="dasar-tabs-list" role="tablist" [ngClass]="listClass" [ngStyle]="listStyle">
    @if (items.length > 0) {
      @for (item of items; track $index; let i = $index) {
        <dasar-button
          [variant]="activeIndex === i && appearance !== 'outline' ? 'primary' : 'ghost'"
          [radius]="appearance === 'outline' ? 'none' : radius"
          [size]="buttonSize"
          [class.active]="activeIndex === i"
          [fluid]="fluid"
          role="tab"
          [attr.aria-selected]="activeIndex === i"
          [attr.tabindex]="activeIndex === i ? 0 : -1"
          (click)="selectTab(i)"
          class="dasar-tab-trigger-btn"
        >
          {{ item }}
        </dasar-button>
      }
    } @else {
      @for (tabSlotDirective of tabItemSlotDirectives; track tabSlotDirective; let i = $index) {
        <dasar-button
          [variant]="activeIndex === i && appearance !== 'outline' ? 'primary' : 'ghost'"
          [radius]="appearance === 'outline' ? 'none' : radius"
          [size]="buttonSize"
          [class.active]="activeIndex === i"
          role="tab"
          [attr.aria-selected]="activeIndex === i"
          [attr.tabindex]="activeIndex === i ? 0 : -1"
          (click)="selectTab(i)"
          [fluid]="fluid"
          class="dasar-tab-trigger-btn"
        >
          <ng-container *ngTemplateOutlet="tabSlotDirective.templateRef"></ng-container>
        </dasar-button>
      }
    }
  </div>
  <div class="dasar-tabs-content" role="tabpanel" [ngClass]="contentClass" [ngStyle]="contentStyle">
    <ng-content></ng-content>
  </div>
</div>
