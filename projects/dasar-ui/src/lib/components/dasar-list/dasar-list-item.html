<div
  class="dasar-list-item"
  [class.active]="active"
  [class.focused]="focused"
  [class.disabled]="isItemDisabled"
  [attr.id]="itemId"
  [attr.role]="list?.selectable ? 'option' : null"
  [attr.aria-selected]="list?.selectable ? active : null"
  [attr.aria-disabled]="isItemDisabled || null"
  [ngClass]="itemClass"
  [ngStyle]="itemStyle"
  (click)="onItemClick($event)"
>
  @if (hasPrefix) {
    <div class="dasar-list-item-prefix">
      <ng-content select="[prefix-slot]"></ng-content>
    </div>
  }

  <div class="dasar-list-item-body">
    <ng-content></ng-content>
  </div>

  @if (hasSuffix) {
    <div class="dasar-list-item-suffix">
      <ng-content select="[suffix-slot]"></ng-content>
    </div>
  }
</div>
