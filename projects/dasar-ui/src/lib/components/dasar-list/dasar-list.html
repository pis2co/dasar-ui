<div
  class="dasar-list-container size-{{ size }} radius-{{ radius }}"
  [class.bordered]="bordered"
  [class.show-divider]="showDivider"
  [class.hoverable]="hoverable"
  [class.clickable]="clickable || selectable"
  [class.selectable]="selectable"
  [class.disabled]="isDisabled"
  [class.scrollable]="!!maxHeight"
  [ngClass]="containerClass"
  [ngStyle]="containerStyle"
>
  @if (hasHeader) {
    <div class="dasar-list-header">
      <ng-content select="[header-slot]"></ng-content>
    </div>
  }

  <div
    #contentRef
    class="dasar-list-content"
    role="listbox"
    [style.max-height]="maxHeight"
    [attr.tabindex]="selectable && keyboard && !isDisabled ? 0 : null"
    [attr.aria-activedescendant]="activeDescendantId"
    [attr.aria-disabled]="isDisabled || null"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
  >
    <ng-content></ng-content>
  </div>

  @if (hasFooter) {
    <div class="dasar-list-footer">
      <ng-content select="[footer-slot]"></ng-content>
    </div>
  }
</div>
