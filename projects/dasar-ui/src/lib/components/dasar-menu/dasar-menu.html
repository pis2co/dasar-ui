<div
  class="dasar-menu-panel appearance-{{ appearance }} size-{{ size }} radius-{{ radius }}"
  [ngClass]="panelClass"
  [ngStyle]="panelStyle"
  [class.fluid]="fluid"
>
  @for (item of items; track item.value; let i = $index) {
    @if (item.divider) {
      <div class="dasar-menu-divider"></div>
    } @else {
      <div
        ngpMenuItem
        [ngpMenuItemDisabled]="item.disabled || disabled"
        class="dasar-menu-item"
        [class.disabled]="item.disabled || disabled"
        [ngClass]="itemClass"
        [ngStyle]="itemStyle"
        (click)="onItemSelect(item)"
      >
        @if (hasMenuItem) {
          <ng-container
            *ngTemplateOutlet="
              providedMenuItem!.templateRef;
              context: { $implicit: item, index: i }
            "
          ></ng-container>
        } @else {
          @if (item.iconName) {
            <dasar-icon [name]="item.iconName" [size]="itemIconSize"></dasar-icon>
          }
          <span class="dasar-menu-item-label">{{ item.label }}</span>
        }
      </div>
    }
  }
</div>
