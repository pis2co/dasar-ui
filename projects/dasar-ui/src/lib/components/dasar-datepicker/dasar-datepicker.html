<div
  class="dasar-datepicker-container"
  [class.full-width]="fullWidth"
  [class.disabled]="disabled"
  [class.error]="error"
  [class.fluid]="fluid"
  [ngClass]="containerClass"
  [ngStyle]="containerStyle"
>
  @if (hasLabelRow) {
    <div
      class="dasar-datepicker-label-wrapper"
      [ngClass]="labelWrapperClass"
      [ngStyle]="labelWrapperStyle"
    >
      <div class="dasar-datepicker-label-content">
        @if (labelSlot) {
          <ng-content select="[label-slot]"></ng-content>
        } @else if (label) {
          {{ label }}
        }
      </div>
      @if (extraLabelSlot) {
        <div class="dasar-datepicker-extra-label-content">
          <ng-content select="[extra-label-slot]"></ng-content>
        </div>
      }
    </div>
  }
  <div
    #triggerElement
    class="dasar-datepicker-wrapper"
    [ngClass]="wrapperClass"
    [ngStyle]="wrapperStyle"
  >
    <div
      class="dasar-datepicker-trigger appearance-{{ appearance }} size-{{ size }} radius-{{
        radius
      }}"
      (click)="toggleDropdown($event)"
      [class.has-value]="hasValue"
      [class.active]="isOpen"
      [ngClass]="triggerClass"
      [ngStyle]="triggerStyle"
      [attr.aria-invalid]="error || null"
      [attr.aria-describedby]="hasHintRow ? hintId : null"
      tabindex="0"
    >
      <ng-content select="[prefix-slot]"></ng-content>
      <span class="value-text">{{ displayText }}</span>
      <div class="datepicker-actions">
        @if (clearable && hasValue) {
          <dasar-icon
            class="clear-icon"
            name="x"
            [size]="iconSize"
            (click)="clearValue($event)"
          ></dasar-icon>
        }
        <dasar-icon
          [name]="type.includes('time') ? 'clock' : 'calendar'"
          [size]="iconSize"
          class="calendar-icon"
        ></dasar-icon>
      </div>
    </div>
    @if (isOpen) {
      <div
        #dropdownElement
        class="dasar-datepicker-dropdown size-{{ size }} radius-{{ radius }} placement-{{
          currentPlacement
        }}"
        [ngClass]="dropdownClass"
        [ngStyle]="dropdownStyle"
      >
        <dasar-calendar
          variant="dropdown"
          [size]="size"
          [range]="range"
          [rangeValue]="internalRange"
          (rangeValueChange)="onRangeSelect($event)"
          (valueChange)="onCalendarSelect($event)"
          (prevMonth)="onPrevMonthClick.emit()"
          (nextMonth)="onNextMonthClick.emit()"
          (prevYear)="onPrevYearClick.emit()"
          (nextYear)="onNextYearClick.emit()"
          [value-format]="valueFormat"
          [(value)]="internalDate"
          [locale]="locale"
        >
          @if (extraFooterSlot) {
            <ng-content
              ngProjectAs="[calendar-footer-slot]"
              select="[extra-footer-slot]"
            ></ng-content>
          }
        </dasar-calendar>
      </div>
    }
  </div>
  @if (hasHintRow) {
    <div
      class="slot-wrapper hint-wrapper"
      [id]="hintId"
      [class.disabled]="disabled"
      [class.error]="error"
      [ngClass]="hintWrapperClass"
      [ngStyle]="hintWrapperStyle"
    >
      <span class="dasar-datepicker-hint-slot" [class.hidden]="!hintSlot">
        <ng-content select="[hint-slot]"></ng-content>
      </span>
      @if (!hintSlot && hint) {
        {{ hint }}
      }
    </div>
  }
</div>
