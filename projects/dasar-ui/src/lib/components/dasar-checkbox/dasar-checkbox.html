<label [ngClass]="containerClasses" [ngStyle]="containerStyle">
  <input
    type="checkbox"
    class="dasar-checkbox-native"
    [checked]="isChecked"
    [indeterminate]="indeterminate"
    [attr.aria-checked]="indeterminate ? 'mixed' : null"
    [disabled]="isDisabled"
    [attr.aria-invalid]="hasError || null"
    [attr.aria-describedby]="hint ? hintId : null"
    (change)="toggle($event)"
    (blur)="onTouched()"
  />
  <span [ngClass]="boxClasses" [ngStyle]="boxStyle" aria-hidden="true">
    @if (indeterminate) {
      <dasar-icon name="minus" size="sm" />
    } @else if (isChecked) {
      <dasar-icon name="check" size="sm" />
    }
  </span>
  @if (label) {
    <span [ngClass]="labelClasses" [ngStyle]="labelStyle">{{ label }}</span>
  }
  <ng-content></ng-content>
</label>
@if (hint) {
  <div [id]="hintId" [ngClass]="hintClasses" [ngStyle]="hintStyle">
    {{ hint }}
  </div>
}
